<!DOCTYPE html>

<html>

    <head>
        <title>Sudoku</title>
        <link rel="stylesheet" href="./styles/global.css">
        <link rel="stylesheet" href="./styles/gameStyle.css">
        <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
        <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script> 
        <script src="./script/gameScript.js" defer></script>
    </head>

    <body>
        <header>
            <button id="back-button">
                <h1>Sudoku</h1>
            </button>
        </header>

        <div class="loading-screen hidden">
            <p>Loading...</p>
        </div>

        <div class="gameEndStatScreen hidden">
            <div class="statistics">
                <h3 id="result"></h3>
                <hr>
                <div class="stat-wrapper">
                    <div class="stat-side1">
                        <p>Time</p>
                        <p>Mistakes</p>
                        <p>Mode</p>
                        <p>Difficulty</p>
                    </div>
                    <hr id="hr-stat">
                    <div>
                        <p id="stat-time"></p>
                        <p id="stat-mistakes"></p>
                        <p id="stat-mode"></p>
                        <p id="stat-difficulty"></p>
                    </div>
                </div>
                <hr>
                <div class="endScreenOptions">
                    <button id="newGame">
                        <p>New game</p>
                    </button>
                    <button id="homeScreen">
                        <p>Home screen</p>
                    </button>
                </div>
            </div>
        </div>

        <div class="container">
            <div class="sudoku-wrapper">

                <div class="top-bar">
    
                    <div class="Difficulty-wrapper top-bar-item">
                        <p>Difficulty</p>
                        <p class="difficulty">Normal</p>
                    </div>
    
                    <div class="mistakes-wrapper top-bar-item">
                        <p>Mistakes</p>
                        <p class="mistakes">0/3</p>
                    </div>
    
                    <div class="timer-wrapper top-bar-item">
                        <p>Time</p>
                        <p class="timer">00:00</p>
                    </div>
    
                </div>
                
    
                <div class="grid">
    
                </div>
    
            </div>
        </div>

    </body>

</html>
