<!DOCTYPE html>

<html>

    <head>
        <title>Sudoku</title>
        <link rel="stylesheet" href="./styles/global.css">
        <link rel="stylesheet" href="./styles/gameStyle.css">
        <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
        <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script> 
        <script src="./script/gameScript.js" defer></script>
    </head>

    <body>
        <header>
            <button id="back-button">
                <h1>Sudoku</h1>
            </button>
            <button id="settings-button">
                <ion-icon name="settings"></ion-icon>
            </button>
        </header>

        <div class="loading-screen hidden">
            <p>Loading...</p>
        </div>

        <div class="sudoku-wrapper">

            <div class="top-bar">

                <div class="Difficulty-wrapper top-bar-item">
                    <p>Difficulty</p>
                    <p class="difficulty">Normal</p>
                </div>

                <div class="mistakes-wrapper top-bar-item">
                    <p>Mistakes</p>
                    <p class="mistakes">0/3</p>
                </div>

                <div class="timer-wrapper top-bar-item">
                    <p>Time</p>
                    <p class="timer">00:00</p>
                </div>

            </div>
            

            <div class="grid">

            </div>

        </div>

    </body>

</html>
